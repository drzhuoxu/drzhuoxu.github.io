<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Intelligence Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one dark screen, drifting light-leak glows behind a centered-left statement; wordmark top, credit bottom. Single deliberate dark look. */
:root {
  --ink: #0c0b0d;
  --paper: #f3eee8;
  --muted: rgba(243, 238, 232, 0.62);
  --leak-amber: #ff8a2a;
  --leak-rose: #e8456b;
  --leak-gold: #ffc861;
  --leak-violet: #6b3fd1;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ink);
  color: var(--paper);
  font-family: var(--display);
  overflow: hidden;
}
.leaks {
  position: fixed;
  inset: -20%;
  filter: blur(70px) saturate(1.15);
  opacity: 0.9;
  pointer-events: none;
}
.leak {
  position: absolute;
  border-radius: 50%;
  mix-blend-mode: screen;
  animation: drift 26s ease-in-out infinite alternate;
}
.l1 { width: 55vmax; height: 40vmax; left: -5%; top: 5%; background: radial-gradient(closest-side, var(--leak-amber), transparent); }
.l2 { width: 45vmax; height: 45vmax; right: -8%; top: -10%; background: radial-gradient(closest-side, var(--leak-rose), transparent); animation-duration: 32s; animation-delay: -8s; }
.l3 { width: 35vmax; height: 28vmax; left: 30%; bottom: -5%; background: radial-gradient(closest-side, var(--leak-gold), transparent); opacity: 0.7; animation-duration: 22s; animation-delay: -4s; }
.l4 { width: 40vmax; height: 40vmax; right: 10%; bottom: -20%; background: radial-gradient(closest-side, var(--leak-violet), transparent); opacity: 0.8; animation-duration: 36s; }
@keyframes drift {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(6vmax, -4vmax) scale(1.12); }
  100% { transform: translate(-5vmax, 5vmax) scale(0.94); }
}
.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.08;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.page {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: clamp(20px, 4vh, 40px);
  max-width: 1280px;
  margin: 0 auto;
  box-sizing: border-box;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
.mark {
  font-weight: 500;
  font-size: 1.05rem;
  letter-spacing: 0.01em;
}
.mark span { color: var(--muted); font-weight: 300; }
.tag {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
main {
  align-self: center;
  display: grid;
  gap: clamp(16px, 3vh, 28px);
}
h1 {
  margin: 0;
  font-weight: 300;
  font-size: clamp(3rem, 11vw, 9.5rem);
  line-height: 0.92;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.lede {
  margin: 0;
  max-width: 40ch;
  font-size: clamp(1rem, 1.6vw, 1.2rem);
  line-height: 1.5;
  color: var(--muted);
}
.back { text-decoration: none; }
.back:hover, .back:focus-visible { color: var(--paper); }
footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.06em;
  color: var(--muted);
}
@media (prefers-reduced-motion: reduce) {
  .leak { animation: none; }
}
</style>
</head>
<body>

<div class="leaks" aria-hidden="true">
  <div class="leak l1"></div>
  <div class="leak l2"></div>
  <div class="leak l3"></div>
  <div class="leak l4"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="page">
  <header>
    <div class="mark">MIG <span>Machine Intelligence Group</span></div>
    <a class="tag back" href="../">Zhuo Xu</a>
  </header>

  <main>
    <h1>To be announced.</h1>
    <p class="lede">Robotics and physical AI research at The University of Texas at Austin.</p>
  </main>

  <footer>
    <span>© 2026, Machine Intelligence Group</span>
    <span>The University of Texas at Austin</span>
  </footer>
</div>
</body>
</html>
